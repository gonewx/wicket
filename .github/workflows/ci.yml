# CI 承载：构建门禁（生成物漂移检查 + 构建）、全量测试、以及 tests/e2e 整包
# 门禁（仓库溯源、命名卫生与协议回归）。工具链版本由 mise.toml pin，
# 不使用运行器自带版本。
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          path: wicket
          fetch-depth: 0

      # 溯源类 e2e 测试要求私有证据仓作为本仓的兄弟目录存在，且需要完整
      # git 历史。凭据经仓库 secret 注入；secret 缺失时 checkout 失败、
      # job 直接红，无降级路径。仓库名与检出路径经运行期表达式拼接，
      # 避免在被追踪文件中出现完整字面量。
      - name: Check out the evidence repository (read-only)
        uses: actions/checkout@v7
        with:
          repository: ${{ format('gonewx/wicket-provenance-{0}', 'evidence') }}
          path: ${{ format('wicket-provenance-{0}', 'evidence') }}
          token: ${{ secrets.WICKET_EVIDENCE_TOKEN }}
          fetch-depth: 0

      - name: Install the pinned toolchain via mise
        uses: jdx/mise-action@v4
        with:
          working_directory: wicket

      - name: Install the DI generator (version derived from go.mod)
        working-directory: wicket
        run: |
          godi_version="$(go mod edit -json | jq -r '.Require[] | select(.Path == "github.com/gonewx/godi").Version')"
          go install "github.com/gonewx/godi/cmd/godi-gen@${godi_version}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run code generation
        working-directory: wicket
        run: go generate ./...

      - name: Verify generated files are committed (drift gate)
        working-directory: wicket
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "generated files drifted from the committed state:"
            git status --porcelain
            git diff
            exit 1
          fi

      - name: Build
        working-directory: wicket
        run: go build ./...

      - name: Run all tests
        working-directory: wicket
        run: go test ./...

      - name: Run e2e lineage gates
        working-directory: wicket
        run: go test ./tests/e2e/...
