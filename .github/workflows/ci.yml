# CI 承载：构建门禁（生成物漂移检查 + 构建）与全量测试。溯源类 e2e 门禁
# （仓库溯源、命名卫生与协议回归）依赖本仓外的私有证据档案，在本地发布
# 窗口执行，不参与 CI（见下方说明）。工具链版本由 mise.toml pin，
# 不使用运行器自带版本。
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          path: wicket
          fetch-depth: 0

      # 溯源类 e2e 血缘门禁依赖本仓外的私有证据档案（本地兄弟目录，
      # 凭据与历史均不进入 CI），在本地发布窗口执行，不参与 CI。
      # 其余门禁（生成物漂移、构建、全量测试）均在 CI 覆盖。

      - name: Install the pinned toolchain via mise
        uses: jdx/mise-action@v4
        with:
          working_directory: wicket

      - name: Install the DI generator (version derived from go.mod)
        working-directory: wicket
        run: |
          godi_version="$(go mod edit -json | jq -r '.Require[] | select(.Path == "github.com/gonewx/godi").Version')"
          go install "github.com/gonewx/godi/cmd/godi-gen@${godi_version}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run code generation
        working-directory: wicket
        run: go generate ./...

      - name: Verify generated files are committed (drift gate)
        working-directory: wicket
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "generated files drifted from the committed state:"
            git status --porcelain
            git diff
            exit 1
          fi

      - name: Build
        working-directory: wicket
        run: go build ./...

      # tests/e2e 依赖本仓外的私有证据档案（见上），在本地执行，CI 排除。
      # 锚定整包路径（含未来子包），避免子串误配（如未来 tests/e2e-extra）；
      # go list 为空则显式失败，防静默绿。
      - name: Run all tests
        working-directory: wicket
        run: |
          pkgs="$(go list ./... | grep -vE '/tests/e2e(/|$)')"
          if [ -z "$pkgs" ]; then
            echo "no packages to test (go list empty); failing loudly"
            exit 1
          fi
          go test $pkgs

      # tests/e2e 整包在本地发布窗口执行（依赖兄弟证据仓，凭据不进 CI）。
      # CI 侧保留编译级覆盖：go build 不编译 _test.go，go vet 可捕获该包
      # 因 API 漂移导致的编译断裂（不执行测试，无需证据仓）。
      - name: Compile lineage gates (vet)
        working-directory: wicket
        run: go vet ./tests/e2e/...
